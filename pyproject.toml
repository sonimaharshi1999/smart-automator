[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-automator"
version = "2.0.0"
description = "AI-powered automation framework with voice+vision assistant, desktop control, and self-healing selectors"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Maharshi Soni"}]
requires-python = ">=3.10"
keywords = ["automation", "playwright", "ai", "testing", "self-healing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
voice = [
    "sounddevice>=0.4.6",
    "faster-whisper>=0.10.0",
    "pyttsx3>=2.90",
]
desktop = [
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
]
all = [
    "sounddevice>=0.4.6",
    "faster-whisper>=0.10.0",
    "pyttsx3>=2.90",
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
smart-automator = "smart_automator.cli:cli"

[project.urls]
Repository = "https://github.com/MaharshiSoni/smart-automator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
